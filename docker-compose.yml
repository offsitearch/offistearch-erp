# development — studioerp-v2 stack: postgres + backend (kernel+rings API)
#
# NOTE: ports deliberately differ from the old project (`Offsite ERP`, which
# uses 8000 / 5432) so both stacks can run simultaneously on one machine:
#   backend  -> 8100
#   postgres -> 5433
# The app listens inside the container on 8100 (APP_PORT / Dockerfile EXPOSE).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-studioerp_v2}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-studioerp_v2}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-studioerp_v2}}
      APP_PORT: ${BACKEND_PORT:-8100}
    command:
      - --reload
    ports:
      - "${BACKEND_PORT:-8100}:8100"
    volumes:
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./backend/templates:/app/templates
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:8100
      VITE_CLIENT_PORT: "${FRONTEND_PORT:-5173}"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
