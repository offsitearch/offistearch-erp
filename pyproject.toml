[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studioerp"
version = "0.1.0"
description = "StudioERP — kernel+rings ERP for architecture/design studios (Plan A rebuild)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.120.*",
    "uvicorn[standard]==0.30.*",
    "sqlalchemy[asyncio]==2.0.*",
    "asyncpg==0.29.*",
    "alembic==1.13.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "PyJWT==2.13.*",
    "bcrypt==4.0.*",
    "tzdata>=2024.1",  # Windows zoneinfo (Asia/Kolkata) needs the tz database
    "python-multipart==0.0.31",
    "httpx==0.27.*",
    "slowapi==0.1.9",
    "aiosmtplib>=5.1,<6.0",
    "Jinja2>=3.1,<4.0",
    "reportlab>=4.0,<5.0",
    "pypdf>=3.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-asyncio==0.25.*",
    "pytest-cov==5.*",
    "ruff==0.6.*",
    "import-linter==2.*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]