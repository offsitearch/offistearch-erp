<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudioERP - Architecture Studio Management Platform" />
    <meta name="theme-color" content="#FAFAF8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>StudioERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#FAFAF8;font-family:Inter,system-ui,sans-serif">
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
          <svg viewBox="0 0 40 40" fill="none" width="64" height="64" aria-hidden="true">
            <rect x="2" y="24" width="6" height="14" rx="2" fill="#1F2937" opacity="0">
              <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0s" fill="freeze" />
              <animateTransform attributeName="transform" type="scale" from="1 0" to="1 1" dur="0.4s" begin="0s" fill="freeze" additive="sum" />
            </rect>
            <rect x="9.5" y="16" width="6" height="22" rx="2" fill="#1F2937" opacity="0">
              <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.1s" fill="freeze" />
              <animateTransform attributeName="transform" type="scale" from="1 0" to="1 1" dur="0.4s" begin="0.1s" fill="freeze" additive="sum" />
            </rect>
            <rect x="17" y="20" width="6" height="18" rx="2" fill="#1F2937" opacity="0">
              <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.2s" fill="freeze" />
              <animateTransform attributeName="transform" type="scale" from="1 0" to="1 1" dur="0.4s" begin="0.2s" fill="freeze" additive="sum" />
            </rect>
            <rect x="24.5" y="8" width="6" height="30" rx="2" fill="#C9964A" opacity="0">
              <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.3s" fill="freeze" />
              <animateTransform attributeName="transform" type="scale" from="1 0" to="1 1" dur="0.4s" begin="0.3s" fill="freeze" additive="sum" />
            </rect>
            <rect x="32" y="26" width="6" height="12" rx="2" fill="#1F2937" opacity="0">
              <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.4s" fill="freeze" />
              <animateTransform attributeName="transform" type="scale" from="1 0" to="1 1" dur="0.4s" begin="0.4s" fill="freeze" additive="sum" />
            </rect>
          </svg>
          <div style="text-align:center">
            <div style="font-size:14px;font-weight:700;letter-spacing:0.12em;color:#1F2937">StudioERP</div>
            <div style="font-size:9px;font-weight:600;letter-spacing:0.18em;color:#999;margin-top:2px;text-transform:uppercase">Studio ERP</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
